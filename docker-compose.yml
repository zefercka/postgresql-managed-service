services:
  migrations:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: migrations
    container_name: ms-migrations
    depends_on:
      - postgres
    env_file:
      - "./.server.env"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - OPENTELEMETRY_COLLECTOR_HOST=opentelemetry
      - OPENTELEMETRY_COLLECTOR_PORT_HTTP=4318
      - OPENTELEMETRY_COLLECTOR_PORT_GRPC=4317
    networks:
      - managed_service_network

  server:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: server
    container_name: ms-server
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
      vault:
        condition: service_healthy
      migrations:
        condition: service_started
    env_file:
      - "./.server.env"
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - DB_HOST=postgres
      - DB_PORT=5432
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROLE_ID_FILE=/vault/approle/server-role-id
      - VAULT_SECRET_ID_FILE=/vault/approle/server-secret-id
      - OPENTELEMETRY_COLLECTOR_HOST=opentelemetry
      - OPENTELEMETRY_COLLECTOR_PORT_HTTP=4318
      - OPENTELEMETRY_COLLECTOR_PORT_GRPC=4317
    ports:
      - "8000:8000"
    volumes:
      - ./app:/opt/postgresql-managed-service/app
      - vault_approle:/vault/approle:ro
    networks:
      - managed_service_network

  postgres:
    image: postgres:16
    container_name: ms-postgres-db
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_managed_service
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - managed_service_network

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: ms-rabbitmq
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
    env_file:
      - "./.server.env"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - managed_service_network

  ansible:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: ansible
    container_name: ms-ansible
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
      vault:
        condition: service_healthy
    env_file:
      - "./.server.env"
    environment:
      - ANSIBLE_SSH_PRIVATE_KEY_PATH=/home/ansibleuser/.ssh/id_rsa
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - DB_HOST=postgres
      - DB_PORT=5432
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROLE_ID_FILE=/vault/approle/server-role-id
      - VAULT_SECRET_ID_FILE=/vault/approle/server-secret-id
      - OPENTELEMETRY_COLLECTOR_HOST=opentelemetry
      - OPENTELEMETRY_COLLECTOR_PORT_HTTP=4318
      - OPENTELEMETRY_COLLECTOR_PORT_GRPC=4317
    volumes:
      - ./ansible:/opt/postgresql-managed-service/ansible
    networks:
      - managed_service_network

  terraform:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: terraform
    container_name: ms-terraform
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
      vault:
        condition: service_healthy
    env_file:
      - "./.server.env"
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - DB_HOST=postgres
      - DB_PORT=5432
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROLE_ID_FILE=/vault/approle/terraform-role-id
      - VAULT_SECRET_ID_FILE=/vault/approle/terraform-secret-id
      - OPENTELEMETRY_COLLECTOR_HOST=opentelemetry
      - OPENTELEMETRY_COLLECTOR_PORT_HTTP=4318
      - OPENTELEMETRY_COLLECTOR_PORT_GRPC=4317
    volumes:
      - terraform_data:/opt/postgresql-managed-service/terraform
      - vault_approle:/vault/approle:ro
    networks:
      - managed_service_network

  vault:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: vault
    container_name: ms-vault
    ports:
      - "18200:8200"
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
      - vault_config:/vault/config
      - vault_init:/vault/init
      - vault_logs:/vault/logs
      - vault_token:/vault/token-storage:rw
      - vault_approle:/vault/approle:rw
    healthcheck:
      test: ["CMD", "sh", "-c", "vault status | grep -q 'Sealed.*false'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - managed_service_network

  grafana:
    image: grafana/grafana:12.1
    container_name: ms-grafana
    deploy:
      restart_policy: 
        condition: on-failure
        delay: 10s
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - managed_service_network

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: ms-prometheus
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    networks:
      - managed_service_network

  loki:
    image: grafana/loki:3.5.8
    container_name: ms-loki
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
    ports:
      - "3100:3100"
    networks:
      - managed_service_network

  tempo:
    image: grafana/tempo:main-1fbce80
    container_name: ms-tempo
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
    ports:
      - "3200:3200"
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    networks:
      - managed_service_network

  opentelemetry:
    image: otel/opentelemetry-collector-contrib:0.140.0
    container_name: ms-opentelemetry
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    environment:
      - TZ=UTC
    command: ["--config=/etc/opentelemetry-config.yaml"]
    volumes:
      - ./opentelemetry-config.yaml:/etc/opentelemetry-config.yaml
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - managed_service_network

volumes:
  pgdata:          # Данные PostgreSQL
  rabbitmq_data:   # Данные RabbitMQ
  terraform_data:  # Данные Terraform 
  vault_data:      # Зашифрованное хранилище Vault
  vault_config:    # Конфигурационные файлы
  vault_token:     # Токены для межсервисного взаимодействия
  vault_init:      # Unseal ключи и root token
  vault_logs:      # Audit логи
  vault_approle:   # AppRole credentials для сервисов
  grafana_data:    # Данные Grafana
  prometheus_data: # Данные Prometheus
  tempo_data:      # Данные Tempo

networks:
  managed_service_network:
    driver: bridge