global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'opentelemetry-collector'
    static_configs:
      - targets: ['opentelemetry:8889']
        labels:
          service: 'postgresql-managed-service'
