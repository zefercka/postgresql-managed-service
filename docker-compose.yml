services:
  migrations:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: migrations
    container_name: ms-migrations
    depends_on:
      - postgres
    env_file:
      - "./.server.env"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    networks:
      - managed_service_network

  server:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: server
    container_name: ms-server
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
      vault:
        condition: service_healthy
      migrations:
        condition: service_started
    env_file:
      - "./.server.env"
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - DB_HOST=postgres
      - DB_PORT=5432
      - VAULT_ADDR=http://vault:8200
    ports:
      - "8000:8000"
    volumes:
      - ./app:/opt/postgresql-managed-service/app
      - vault_approle:/vault/approle:ro
    networks:
      - managed_service_network

  postgres:
    image: postgres:16
    container_name: ms-postgres-db
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_managed_service
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - managed_service_network

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: ms-rabbitmq
    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s
    env_file:
      - "./.server.env"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - managed_service_network

  ansible:
    build:
      context: .
      dockerfile: ./ansible/Dockerfile
    container_name: ms-ansible
    volumes:
      - ./ansible:/opt/postgresql-managed-service/ansible
    networks:
      - managed_service_network

  terraform:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: terraform
    container_name: ms-terraform
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
      vault:
        condition: service_healthy
    env_file:
      - "./.server.env"
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - DB_HOST=postgres
      - DB_PORT=5432
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROLE_ID_FILE=/vault/approle/terraform-role-id
      - VAULT_SECRET_ID_FILE=/vault/approle/terraform-secret-id
    volumes:
      - terraform_data:/opt/postgresql-managed-service/terraform
      - vault_approle:/vault/approle:ro
    networks:
      - managed_service_network

  vault:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: vault
    container_name: ms-vault
    ports:
      - "18200:8200"
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
      - vault_config:/vault/config
      - vault_init:/vault/init
      - vault_logs:/vault/logs
      - vault_token:/vault/token-storage:rw
      - vault_approle:/vault/approle:rw
    healthcheck:
      test: ["CMD", "sh", "-c", "vault status | grep -q 'Sealed.*false'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - managed_service_network

volumes:
  pgdata:
  rabbitmq_data:
  terraform_data:
  vault_data:      # Зашифрованное хранилище Vault
  vault_config:    # Конфигурационные файлы
  vault_token:     # Токены для межсервисного взаимодействия
  vault_init:      # Unseal ключи и root token
  vault_logs:      # Audit логи
  vault_approle:   # AppRole credentials для сервисов

networks:
  managed_service_network:
    driver: bridge