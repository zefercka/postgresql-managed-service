---
- name: Stage1 - Change IP address on VM
  hosts: all
  become: yes
  gather_facts: no

  vars:
    new_ip: "{{ new_ip }}"
    netmask: "{{ netmask | default('24') }}"
    gateway: "{{ gateway | default('192.168.100.1') }}"

  tasks:

    - name: Backup existing netplan
      copy:
        src: /etc/netplan/01-netcfg.yaml
        dest: /etc/netplan/01-netcfg.yaml.bak
        remote_src: yes

    - name: Apply new netplan config
      template:
        src: templates/01-netcfg.yaml.j2
        dest: /etc/netplan/01-netcfg.yaml
        mode: 0644

    - name: Apply netplan
      command: netplan apply
      async: 5
      poll: 0